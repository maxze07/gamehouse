<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบัญชีลิงก์ — Ledger Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2b24;
    --ink-soft:#2f4438;
    --parchment:#f4efe2;
    --parchment-deep:#ebe3cf;
    --gold:#c8992e;
    --gold-soft:#e7c988;
    --income:#3e7c6a;
    --income-bg:#e4efe9;
    --expense:#b5533c;
    --expense-bg:#f6e6e0;
    --line:#d8cdb2;
    --shadow:0 12px 30px rgba(28,43,36,.14);
    --radius:14px;
    --radius-sm:8px;
    --serif:'Fraunces', serif;
    --sans:'Inter','IBM Plex Sans Thai',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(200,153,46,.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(62,124,106,.08), transparent 45%);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .ledger-cover{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg,var(--ink) 0%, var(--ink-soft) 100%);
    border-radius:20px;
    padding:44px 36px 36px;
    color:var(--parchment);
    box-shadow:0 30px 60px rgba(20,30,25,.35);
    position:relative;
    overflow:hidden;
  }
  .ledger-cover::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(200,153,46,.35);
    border-radius:14px;
    pointer-events:none;
  }
  .ledger-mark{
    width:46px;height:46px;
    border:1.5px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);
    font-size:20px;
    color:var(--gold-soft);
    margin-bottom:22px;
  }
  .ledger-cover h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:30px;
    line-height:1.25;
    margin:0 0 6px;
  }
  .ledger-cover p.sub{
    color:#c9d3ca;
    font-size:14px;
    margin:0 0 30px;
    line-height:1.6;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    letter-spacing:.02em;
    color:#c9d3ca;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(200,153,46,.3);
    background:rgba(255,255,255,.06);
    color:var(--parchment);
    font-size:15px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .field input:focus{border-color:var(--gold); background:rgba(255,255,255,.1);}
  .field input::placeholder{color:#8fa098;}
  .auth-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    font-size:15px;
    margin-top:6px;
    transition:transform .12s ease, background .15s;
  }
  .auth-btn:hover{background:var(--gold-soft);}
  .auth-btn:active{transform:scale(.98);}
  .auth-toggle{
    text-align:center;
    margin-top:20px;
    font-size:13.5px;
    color:#c9d3ca;
  }
  .auth-toggle button{
    background:none;border:none;color:var(--gold-soft);
    font-weight:600; text-decoration:underline;
    text-underline-offset:3px;
    font-size:13.5px;
  }
  .auth-error{
    background:rgba(181,83,60,.18);
    border:1px solid rgba(181,83,60,.5);
    color:#f0c9be;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }
  .auth-note{
    background:rgba(62,124,106,.18);
    border:1px solid rgba(62,124,106,.5);
    color:#c9e3d8;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }

  /* ---------- App shell ---------- */
  #app{display:none;}
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--parchment);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;
    padding:18px 24px 0;
  }
  .brand-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);color:var(--gold);font-size:16px;
  }
  .brand h1{
    font-family:var(--serif);font-size:19px;font-weight:600;margin:0;
    color:var(--ink);
  }
  .user-chip{
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--ink-soft);
  }
  .user-chip .avatar{
    width:28px;height:28px;border-radius:50%;
    background:var(--ink);color:var(--parchment);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .logout-btn{
    border:1px solid var(--line);
    background:transparent;
    padding:6px 12px;border-radius:20px;
    font-size:12.5px;color:var(--ink-soft);
    transition:background .15s;
  }
  .logout-btn:hover{background:var(--parchment-deep);}

  .tabs{
    display:flex;gap:6px;
  }
  .tab-btn{
    border:none;background:transparent;
    padding:11px 18px 13px;
    font-size:14.5px;font-weight:600;
    color:#8a8272;
    border-bottom:3px solid transparent;
    position:relative;
    transition:color .15s;
  }
  .tab-btn.active{color:var(--ink);}
  .tab-btn[data-tab="income"].active{border-color:var(--income);}
  .tab-btn[data-tab="expense"].active{border-color:var(--expense);}
  .tab-btn .count{
    font-size:11px;margin-left:5px;color:#a89f8c;
  }

  .toolbar{
    max-width:1080px;margin:0 auto;
    padding:18px 24px 22px;
    display:flex;flex-wrap:wrap;gap:12px;
    align-items:center;justify-content:space-between;
  }
  .dropdown-wrap{position:relative;}
  .dropdown-btn{
    display:flex;align-items:center;gap:8px;
    background:#fff;
    border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;
    font-size:13.5px;color:var(--ink-soft);font-weight:500;
  }
  .dropdown-btn svg{transition:transform .15s;}
  .dropdown-btn.open svg{transform:rotate(180deg);}
  .dropdown-menu{
    position:absolute;top:calc(100% + 6px);left:0;
    background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow);
    min-width:190px;padding:6px;z-index:20;
    display:none;
  }
  .dropdown-menu.open{display:block;}
  .dropdown-menu button{
    width:100%;text-align:left;
    background:none;border:none;padding:9px 10px;
    border-radius:7px;font-size:13.5px;color:var(--ink);
  }
  .dropdown-menu button:hover{background:var(--parchment-deep);}
  .dropdown-menu button.active-cat{color:var(--gold);font-weight:700;}
  .dropdown-menu .divider{height:1px;background:var(--line);margin:5px 2px;}

  .add-btn{
    background:var(--ink);color:var(--parchment);
    border:none;padding:10px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:8px;
    transition:background .15s;
  }
  .add-btn:hover{background:var(--ink-soft);}

  main{max-width:1080px;margin:0 auto;padding:0 24px 60px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 8px rgba(28,43,36,.05);
    transition:box-shadow .18s, transform .18s;
    display:flex;flex-direction:column;
  }
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .card-img{
    width:100%;aspect-ratio:16/10;
    background:var(--parchment-deep);
    position:relative;overflow:hidden;
    cursor:zoom-in;
  }
  .card-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-img .no-img{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:#b3a98f;font-size:12px;font-family:var(--serif);
  }
  .cat-tag{
    position:absolute;top:10px;left:10px;
    font-size:10.5px;font-weight:700;letter-spacing:.02em;
    padding:4px 9px;border-radius:20px;
    backdrop-filter:blur(3px);
  }
  .cat-tag.income{background:rgba(228,239,233,.92);color:var(--income);}
  .cat-tag.expense{background:rgba(246,230,224,.92);color:var(--expense);}

  .card-body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-title{
    font-family:var(--serif);font-size:16px;font-weight:600;
    color:var(--ink);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-link{
    font-size:12px;color:#8a8272;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-link a{color:#8a8272;text-decoration:none;}
  .card-link a:hover{color:var(--gold);text-decoration:underline;}
  .card-sub{
    font-size:11px;color:#b3a98f;margin-top:auto;padding-top:4px;
  }
  .card-actions{
    display:flex;gap:6px;padding:0 15px 14px;
  }
  .icon-btn{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 0;border-radius:8px;border:1px solid var(--line);
    background:var(--parchment);font-size:12.5px;color:var(--ink-soft);
    transition:background .15s,color .15s,border-color .15s;
  }
  .icon-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .icon-btn.danger:hover{background:var(--expense);border-color:var(--expense);}
  .icon-btn svg{width:14px;height:14px;}

  .empty-state{
    text-align:center;padding:70px 20px;color:#a89f8c;
  }
  .empty-state .glyph{font-family:var(--serif);font-size:40px;color:var(--gold-soft);margin-bottom:10px;}
  .empty-state h3{font-family:var(--serif);color:var(--ink-soft);font-size:19px;margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0;}

  /* ---------- Modal: add/edit ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,28,23,.55);
    display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--parchment);
    border-radius:16px;
    width:100%;max-width:460px;
    max-height:90vh;overflow-y:auto;
    box-shadow:0 30px 60px rgba(20,30,25,.4);
    border:1px solid var(--line);
  }
  .modal-head{
    padding:22px 24px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;}
  .modal-close{background:none;border:none;font-size:20px;color:#a89f8c;line-height:1;padding:4px;}
  .modal-body{padding:20px 24px 24px;}
  .type-toggle{
    display:flex;gap:8px;margin-bottom:18px;
  }
  .type-toggle button{
    flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:600;color:#8a8272;
  }
  .type-toggle button[data-type="income"].active{border-color:var(--income);color:var(--income);background:var(--income-bg);}
  .type-toggle button[data-type="expense"].active{border-color:var(--expense);color:var(--expense);background:var(--expense-bg);}

  .field-light{margin-bottom:14px;}
  .field-light label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field-light input, .field-light select{
    width:100%;padding:11px 13px;border-radius:9px;
    border:1px solid var(--line);background:#fff;
    font-size:14px;color:var(--ink);outline:none;
  }
  .field-light input:focus, .field-light select:focus{border-color:var(--gold);}

  .upload-box{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    background:#fff;
    position:relative;
    overflow:hidden;
    min-height:100px;
    display:flex;align-items:center;justify-content:center;
  }
  .upload-box.has-img{border-style:solid;padding:0;}
  .upload-box img{width:100%;max-height:180px;object-fit:cover;display:block;}
  .upload-box .hint{font-size:12.5px;color:#a89f8c;}
  .upload-box input[type=file]{display:none;}

  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-primary{
    flex:1;padding:12px;border:none;border-radius:10px;
    background:var(--ink);color:#fff;font-weight:700;font-size:14px;
    transition:background .15s;
  }
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
  .btn-ghost{
    padding:12px 18px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink-soft);font-size:14px;font-weight:600;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;background:rgba(10,15,12,.92);
    display:none;align-items:center;justify-content:center;
    z-index:200;padding:30px;flex-direction:column;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:min(90vw,900px);max-height:75vh;
    border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);
    object-fit:contain;
  }
  .lightbox-info{
    margin-top:18px;color:var(--parchment);text-align:center;max-width:600px;
  }
  .lightbox-info h3{font-family:var(--serif);font-size:20px;margin:0 0 4px;}
  .lightbox-info a{color:var(--gold-soft);font-size:13px;}
  .lightbox-close{
    position:absolute;top:22px;right:26px;
    background:rgba(255,255,255,.1);border:none;color:#fff;
    width:38px;height:38px;border-radius:50%;font-size:18px;
  }
  .lightbox-actions{display:flex;gap:10px;margin-top:16px;}
  .lightbox-actions a, .lightbox-actions button{
    padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:600;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
    color:var(--parchment);text-decoration:none;
  }

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--parchment);
    padding:12px 20px;border-radius:30px;font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0;transition:opacity .25s, transform .25s;
    z-index:300;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:560px){
    .toolbar{flex-direction:column;align-items:stretch;}
    .add-btn{justify-content:center;}
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div class="auth-wrap" id="authScreen">
  <div class="ledger-cover">
    <div class="ledger-mark">฿</div>
    <h1 id="authTitle">เข้าสู่ระบบสมุดบัญชีลิงก์</h1>
    <p class="sub" id="authSub">เก็บลิงก์รายรับ–รายจ่ายของคุณไว้ในที่เดียว พร้อมรูปภาพประกอบ</p>

    <div class="auth-error" id="authError"></div>
    <div class="auth-note" id="authNote"></div>

    <form id="authForm">
      <div class="field">
        <label>อีเมล</label>
        <input type="email" id="authEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" id="authPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-btn" id="authSubmitBtn">เข้าสู่ระบบ</button>
    </form>

    <div class="auth-toggle">
      <span id="authToggleText">ยังไม่มีบัญชี?</span>
      <button type="button" id="authToggleBtn">สมัครสมาชิก</button>
    </div>

    <div id="dbStatus" style="text-align:center;margin-top:18px;font-size:11.5px;color:#8fa098;display:flex;align-items:center;justify-content:center;gap:6px;">
      <span id="dbStatusDot" style="width:7px;height:7px;border-radius:50%;background:#8fa098;display:inline-block;"></span>
      <span id="dbStatusText">กำลังตรวจสอบการเชื่อมต่อฐานข้อมูล...</span>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <div class="mark">฿</div>
          <h1>สมุดบัญชีลิงก์</h1>
        </div>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">U</div>
          <span id="userEmail"></span>
          <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="income">รายรับ <span class="count" id="incomeCount"></span></button>
        <button class="tab-btn" data-tab="expense">รายจ่าย <span class="count" id="expenseCount"></span></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="dropdown-wrap">
      <button class="dropdown-btn" id="catDropdownBtn">
        <span id="catDropdownLabel">ทุกหมวดหมู่</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dropdown-menu" id="catDropdownMenu"></div>
    </div>
    <button class="add-btn" id="openAddModal">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      เพิ่มลิงก์
    </button>
  </div>

  <main>
    <div class="grid" id="cardGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">”</div>
      <h3>ยังไม่มีรายการ</h3>
      <p>เริ่มเก็บลิงก์แรกของคุณโดยกด "เพิ่มลิงก์"</p>
    </div>
  </main>
</div>

<!-- ============ Add/Edit Modal ============ -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">เพิ่มลิงก์ใหม่</h2>
      <button class="modal-close" id="formClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="type-toggle" id="typeToggle">
        <button type="button" data-type="income" class="active">รายรับ</button>
        <button type="button" data-type="expense">รายจ่าย</button>
      </div>

      <div class="field-light">
        <label>ชื่อรายการ</label>
        <input type="text" id="fieldTitle" placeholder="เช่น เงินเดือนเดือนกันยายน">
      </div>
      <div class="field-light">
        <label>หมวดหมู่</label>
        <input type="text" id="fieldCategory" placeholder="เช่น เงินเดือน, ค่าอาหาร, ค่าเช่า">
      </div>
      <div class="field-light">
        <label>ลิงก์ (URL)</label>
        <input type="url" id="fieldUrl" placeholder="https://...">
      </div>
      <div class="field-light">
        <label>รูปภาพ</label>
        <label class="upload-box" id="uploadBox">
          <span class="hint" id="uploadHint">คลิกเพื่ออัปโหลดรูปภาพ</span>

<script>
/* ==================================================================
   ตั้งค่า Supabase — ใส่ URL และ anon key ของโปรเจกต์คุณตรงนี้
================================================================== */
const SUPABASE_URL = 'https://aeilijrkzbknqgzhqcfs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlaWxpanJremJrbnFnemhxY2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDEwNDgsImV4cCI6MjEwMzIxNzA0OH0.drZ9SQmikrsEypCPatsUQzgwUelEe0LDwCdqyLuxXGk';
const BUCKET = 'link-images'; // ชื่อ storage bucket (ต้องสร้างและตั้งเป็น public)
const TABLE = 'links';        // ชื่อตารางในฐานข้อมูล

/*
สร้างตารางด้วย SQL นี้ใน Supabase SQL editor:

create table links (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users not null,
  type text not null check (type in ('income','expense')),
  category text default 'ทั่วไป',
  title text not null,
  url text,
  image_url text,
  created_at timestamptz default now()
);

alter table links enable row level security;

create policy "Users manage their own links"
on links for all
using (auth.uid() = user_id)
with check (auth.uid() = user_id);

-- Storage: สร้าง bucket ชื่อ link-images แบบ public ผ่านหน้า Storage ใน Dashboard
-- แล้วเพิ่ม policy อนุญาตให้ authenticated users upload/read/delete ไฟล์ของตัวเอง
*/

let currentUser = null;
let allLinks = [];
let activeTab = 'income';
let activeCategory = 'all';
let editingId = null;
let pendingImageFile = null;
let pendingImageRemoved = false;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

/* ---------------- Toast ---------------- */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ---------------- Config check + client creation ----------------
   ทำเป็น try/catch เพื่อไม่ให้ error ตอนสร้าง client (เช่น URL ยังเป็น
   placeholder) ไปทำให้โค้ดส่วนอื่น (ปุ่มสลับล็อกอิน/สมัครสมาชิก ฯลฯ)
   หยุดทำงานไปด้วย
------------------------------------------------------------------- */
let supabase = null;
let configOk = true;

if(!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE_URL') ||
   !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')){
  configOk = false;
} else {
  try{
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(err){
    configOk = false;
    console.error('Supabase init error:', err);
  }
}

if(!configOk){
  const errBox = document.getElementById('authError');
  errBox.textContent = 'ยังไม่ได้ตั้งค่า Supabase URL / anon key ในโค้ด (ดูบรรทัดบนของ <script>) กรุณาใส่ค่าจริงจากโปรเจกต์ Supabase ของคุณก่อนใช้งาน';
  errBox.style.display = 'block';
  document.getElementById('authSubmitBtn').disabled = true;
  const dot = document.getElementById('dbStatusDot');
  const txt = document.getElementById('dbStatusText');
  if(dot && txt){ dot.style.background = '#b5533c'; txt.textContent = 'ยังไม่ได้เชื่อมต่อฐานข้อมูล (ยังไม่ได้ตั้งค่า)'; }
}

/* ---------------- DB connection check ----------------
   ping ตาราง links แบบเบาๆ เพื่อยืนยันว่าเชื่อมต่อ Supabase/ฐานข้อมูลได้จริง
   และแสดงสถานะให้ผู้ใช้เห็นบนหน้าล็อกอิน
------------------------------------------------------------------- */
async function checkDbConnection(){
  const dot = document.getElementById('dbStatusDot');
  const txt = document.getElementById('dbStatusText');
  if(!configOk || !supabase) return;
  try{
    const { error } = await supabase.from(TABLE).select('id', { count: 'exact', head: true });
    if(error){
      // ตารางอาจยังไม่ถูกสร้าง แต่การเชื่อมต่อ Supabase (auth) เองยังใช้ได้
      dot.style.background = '#c8992e';
      txt.textContent = 'เชื่อมต่อ Supabase ได้ แต่ยังไม่พบตาราง "links" (รัน SQL setup ก่อน)';
      return;
    }
    dot.style.background = '#3e7c6a';
    txt.textContent = 'เชื่อมต่อฐานข้อมูลสำเร็จ';
  }catch(err){
    dot.style.background = '#b5533c';
    txt.textContent = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + err.message;
  }
}
checkDbConnection();

/* ---------------- Auth ---------------- */
let authMode = 'login'; // login | signup

$('#authToggleBtn').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  if(authMode === 'signup'){
    $('#authTitle').textContent = 'สมัครสมาชิกใหม่';
    $('#authSub').textContent = 'สร้างบัญชีเพื่อเริ่มเก็บลิงก์รายรับ–รายจ่ายของคุณ';
    $('#authSubmitBtn').textContent = 'สมัครสมาชิก';
    $('#authToggleText').textContent = 'มีบัญชีอยู่แล้ว?';
    $('#authToggleBtn').textContent = 'เข้าสู่ระบบ';
  } else {
    $('#authTitle').textContent = 'เข้าสู่ระบบสมุดบัญชีลิงก์';
    $('#authSub').textContent = 'เก็บลิงก์รายรับ–รายจ่ายของคุณไว้ในที่เดียว พร้อมรูปภาพประกอบ';
    $('#authSubmitBtn').textContent = 'เข้าสู่ระบบ';
    $('#authToggleText').textContent = 'ยังไม่มีบัญชี?';
    $('#authToggleBtn').textContent = 'สมัครสมาชิก';
  }
  $('#authError').style.display = 'none';
  $('#authNote').style.display = 'none';
});

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!configOk){ toast('กรุณาตั้งค่า Supabase URL / anon key ในโค้ดก่อน'); return; }
  const email = $('#authEmail').value.trim();
  const password = $('#authPassword').value;
  const errBox = $('#authError');
  const noteBox = $('#authNote');
  errBox.style.display = 'none';
  noteBox.style.display = 'none';
  $('#authSubmitBtn').disabled = true;

  try{
    if(authMode === 'login'){
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if(error) throw error;
      if(!data.session){
        errBox.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
        errBox.style.display = 'block';
      }
      // สำเร็จ -> onAuthStateChange จะพาเข้าหน้าแอปให้เอง
    } else {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if(error) throw error;

      // Supabase trick: ถ้าอีเมลนี้สมัครไปแล้ว (และเปิด Confirm email ไว้)
      // signUp จะไม่คืน error แต่จะคืน user ที่มี identities เป็น array ว่าง
      const alreadyRegistered = data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;

      if(alreadyRegistered){
        errBox.textContent = 'อีเมลนี้มีบัญชีในระบบอยู่แล้ว กรุณาเข้าสู่ระบบแทน';
        errBox.style.display = 'block';
      } else if(data.session){
        // ปิดยืนยันอีเมลไว้ -> ได้ session ทันที ระบบจะพาเข้าแอปเอง
        noteBox.textContent = 'สมัครสมาชิกสำเร็จ กำลังพาเข้าสู่ระบบ...';
        noteBox.style.display = 'block';
      } else {
        noteBox.textContent = 'สมัครสำเร็จ! ระบบต้องการยืนยันอีเมล กรุณาตรวจสอบกล่องจดหมาย (รวม Junk/Spam) แล้วกดลิงก์ยืนยันก่อนเข้าสู่ระบบ';
        noteBox.style.display = 'block';
      }
    }
  }catch(err){
    errBox.textContent = translateAuthError(err.message);
    errBox.style.display = 'block';
  }finally{
    $('#authSubmitBtn').disabled = false;
  }
});

function translateAuthError(msg){
  if(/invalid login credentials/i.test(msg)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือยังไม่เคยสมัครสมาชิกด้วยอีเมลนี้';
  if(/already registered/i.test(msg) || /already been registered/i.test(msg)) return 'อีเมลนี้มีบัญชีในระบบอยู่แล้ว กรุณาเข้าสู่ระบบแทน';
  if(/user not found/i.test(msg)) return 'ไม่พบบัญชีผู้ใช้นี้ในระบบ กรุณาสมัครสมาชิกก่อน';
  if(/email not confirmed/i.test(msg)) return 'อีเมลนี้ยังไม่ได้ยืนยัน กรุณาตรวจสอบกล่องจดหมายและกดลิงก์ยืนยันก่อน';
  if(/password/i.test(msg) && /6/i.test(msg)) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  if(/rate limit/i.test(msg)) return 'มีการพยายามหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่';
  if(/network/i.test(msg) || /fetch/i.test(msg)) return 'เชื่อมต่ออินเทอร์เน็ต/ฐานข้อมูลไม่สำเร็จ กรุณาลองใหม่';
  return msg;
}

$('#logoutBtn').addEventListener('click', async () => {
  if(!configOk) return;
  await supabase.auth.signOut();
});

if(configOk){
  supabase.auth.onAuthStateChange((event, session) => {
    currentUser = session?.user || null;
    if(currentUser){
      $('#authScreen').style.display = 'none';
      $('#app').style.display = 'block';
      $('#userEmail').textContent = currentUser.email;
      $('#userAvatar').textContent = currentUser.email[0].toUpperCase();
      fetchLinks();
    } else {
      $('#authScreen').style.display = 'flex';
      $('#app').style.display = 'none';
    }
  });
}

/* ---------------- Tabs ---------------- */
$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    activeCategory = 'all';
    renderCategoryDropdown();
    renderGrid();
  });
});

/* ---------------- Category dropdown ---------------- */
$('#catDropdownBtn').addEventListener('click', () => {
  $('#catDropdownBtn').classList.toggle('open');
  $('#catDropdownMenu').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.dropdown-wrap')){
    $('#catDropdownBtn').classList.remove('open');
    $('#catDropdownMenu').classList.remove('open');
  }
});

function renderCategoryDropdown(){
  const cats = [...new Set(allLinks.filter(l => l.type === activeTab).map(l => l.category || 'ทั่วไป'))];
  const menu = $('#catDropdownMenu');
  menu.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'ทุกหมวดหมู่';
  allBtn.className = activeCategory === 'all' ? 'active-cat' : '';
  allBtn.onclick = () => { activeCategory = 'all'; $('#catDropdownLabel').textContent = 'ทุกหมวดหมู่'; closeDropdown(); renderGrid(); };
  menu.appendChild(allBtn);
  if(cats.length){
    const div = document.createElement('div');
    div.className = 'divider';
    menu.appendChild(div);
  }
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.textContent = cat;
    b.className = activeCategory === cat ? 'active-cat' : '';
    b.onclick = () => { activeCategory = cat; $('#catDropdownLabel').textContent = cat; closeDropdown(); renderGrid(); };
    menu.appendChild(b);
  });
}
function closeDropdown(){
  $('#catDropdownBtn').classList.remove('open');
  $('#catDropdownMenu').classList.remove('open');
}

/* ---------------- Data ---------------- */
async function fetchLinks(){
  const { data, error } = await supabase
    .from(TABLE)
    .select('*')
    .order('created_at', { ascending: false });
  if(error){ toast('โหลดข้อมูลไม่สำเร็จ: ' + error.message); return; }
  allLinks = data || [];
  renderCategoryDropdown();
  renderGrid();
}

function renderGrid(){
  const grid = $('#cardGrid');
  const empty = $('#emptyState');
  let items = allLinks.filter(l => l.type === activeTab);
  if(activeCategory !== 'all') items = items.filter(l => (l.category || 'ทั่วไป') === activeCategory);

  $('#incomeCount').textContent = allLinks.filter(l => l.type === 'income').length || '';
  $('#expenseCount').textContent = allLinks.filter(l => l.type === 'expense').length || '';

  grid.innerHTML = '';
  if(items.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = new Date(item.created_at).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' });
    card.innerHTML = `
      <div class="card-img" data-id="${item.id}">
        <span class="cat-tag ${item.type}">${escapeHtml(item.category || 'ทั่วไป')}</span>
        ${item.image_url ? `<img src="${item.image_url}" alt="${escapeHtml(item.title)}">` : `<div class="no-img">ไม่มีรูปภาพ</div>`}
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(item.title)}</div>
        ${item.url ? `<div class="card-link"><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.url)}</a></div>` : ''}
        <div class="card-sub">${dateStr}</div>
      </div>
      <div class="card-actions">
        <button class="icon-btn edit-btn" data-id="${item.id}">
          <svg viewBox="0 0 16 16" fill="none"><path d="M11 2l3 3-8 8H3v-3l8-8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          แก้ไข
        </button>
        <button class="icon-btn danger delete-btn" data-id="${item.id}">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ลบ
        </button>
      </div>
    `;
    grid.appendChild(card);
  });

  $$('.card-img').forEach(el => el.addEventListener('click', () => openLightbox(el.dataset.id)));
  $$('.edit-btn').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(el.dataset.id); }));
  $$('.delete-btn').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); deleteLink(el.dataset.id); }));
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

/* ---------------- Add / Edit modal ---------------- */
$('#openAddModal').addEventListener('click', () => openAddModal());

function openAddModal(){
  editingId = null;
  pendingImageFile = null;
  pendingImageRemoved = false;
  $('#formTitle').textContent = 'เพิ่มลิงก์ใหม่';
  $('#fieldTitle').value = '';
  $('#fieldCategory').value = '';
  $('#fieldUrl').value = '';
  resetUploadBox();
  setTypeToggle(activeTab === 'expense' ? 'expense' : 'income');
  $('#formOverlay').classList.add('open');
}

function openEditModal(id){
  const item = allLinks.find(l => l.id === id);
  if(!item) return;
  editingId = id;
  pendingImageFile = null;
  pendingImageRemoved = false;
  $('#formTitle').textContent = 'แก้ไขลิงก์';
  $('#fieldTitle').value = item.title || '';
  $('#fieldCategory').value = item.category || '';
  $('#fieldUrl').value = item.url || '';
  resetUploadBox(item.image_url);
  setTypeToggle(item.type);
  $('#formOverlay').classList.add('open');
}

function resetUploadBox(existingUrl){
  const box = $('#uploadBox');
  if(existingUrl){
    box.classList.add('has-img');
    box.innerHTML = `<img src="${existingUrl}" alt=""><input type="file" id="fieldImage" accept="image/*">`;
  } else {
    box.classList.remove('has-img');
    box.innerHTML = `<span class="hint" id="uploadHint">คลิกเพื่ออัปโหลดรูปภาพ</span><input type="file" id="fieldImage" accept="image/*">`;
  }
  $('#fieldImage').addEventListener('change', handleImageSelect);
}

function handleImageSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  pendingImageFile = file;
  pendingImageRemoved = false;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const box = $('#uploadBox');
    box.classList.add('has-img');
    box.innerHTML = `<img src="${ev.target.result}" alt=""><input type="file" id="fieldImage" accept="image/*">`;
    $('#fieldImage').addEventListener('change', handleImageSelect);
  };
  reader.readAsDataURL(file);
}

function setTypeToggle(type){
  $$('#typeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
}
$('#typeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  setTypeToggle(btn.dataset.type);
});

$('#formClose').addEventListener('click', closeFormModal);
$('#formCancel').addEventListener('click', closeFormModal);
function closeFormModal(){ $('#formOverlay').classList.remove('open'); }

$('#formSave').addEventListener('click', async () => {
  const title = $('#fieldTitle').value.trim();
  const category = $('#fieldCategory').value.trim() || 'ทั่วไป';
  const url = $('#fieldUrl').value.trim();
  const type = $('#typeToggle button.active').dataset.type;

  if(!title){ toast('กรุณาใส่ชื่อรายการ'); return; }

  $('#formSave').disabled = true;
  $('#formSave').textContent = 'กำลังบันทึก...';

  try{
    let imageUrl = editingId ? (allLinks.find(l => l.id === editingId)?.image_url || null) : null;

    if(pendingImageFile){
      const ext = pendingImageFile.name.split('.').pop();
      const path = `${currentUser.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, pendingImageFile);
      if(upErr) throw upErr;
      const { data: pub } = supabase.storage.from(BUCKET).getPublicUrl(path);
      imageUrl = pub.publicUrl;
    }

    if(editingId){
      const { error } = await supabase.from(TABLE).update({
        title, category, url, type, image_url: imageUrl
      }).eq('id', editingId);
      if(error) throw error;
      toast('แก้ไขรายการสำเร็จ');
    } else {
      const { error } = await supabase.from(TABLE).insert({
        title, category, url, type, image_url: imageUrl, user_id: currentUser.id
      });
      if(error) throw error;
      toast('เพิ่มรายการสำเร็จ');
    }

    closeFormModal();
    fetchLinks();
  }catch(err){
    toast('เกิดข้อผิดพลาด: ' + err.message);
  }finally{
    $('#formSave').disabled = false;
    $('#formSave').textContent = 'บันทึก';
  }
});

/* ---------------- Delete ---------------- */
async function deleteLink(id){
  if(!confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) return;
  const { error } = await supabase.from(TABLE).delete().eq('id', id);
  if(error){ toast('ลบไม่สำเร็จ: ' + error.message); return; }
  toast('ลบรายการแล้ว');
  closeLightbox();
  fetchLinks();
}

/* ---------------- Lightbox ---------------- */
let lightboxItemId = null;
function openLightbox(id){
  const item = allLinks.find(l => l.id === id);
  if(!item) return;
  lightboxItemId = id;
  $('#lightboxImg').src = item.image_url || '';
  $('#lightboxImg').style.display = item.image_url ? 'block' : 'none';
  $('#lightboxTitle').textContent = item.title;
  $('#lightboxUrl').textContent = item.url || '';
  $('#lightboxUrl').href = item.url || '#';
  $('#lightboxUrl').style.display = item.url ? 'inline-block' : 'none';
  $('#lightboxDownload').href = item.image_url || '#';
  $('#lightboxDownload').style.display = item.image_url ? 'inline-block' : 'none';
  $('#lightbox').classList.add('open');
}
$('#lightboxClose').addEventListener('click', closeLightbox);
$('#lightbox').addEventListener('click', (e) => { if(e.target.id === 'lightbox') closeLightbox(); });
function closeLightbox(){ $('#lightbox').classList.remove('open'); lightboxItemId = null; }

$('#lightboxEdit').addEventListener('click', () => {
  if(lightboxItemId){ closeLightbox(); openEditModal(lightboxItemId); }
});
$('#lightboxDelete').addEventListener('click', () => {
  if(lightboxItemId) deleteLink(lightboxItemId);
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ closeLightbox(); closeFormModal(); }
});
</script>
</body>
</html>
